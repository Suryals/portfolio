<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, sans-serif">
  <style>
    .ink{fill:#111827}.mut{fill:#6b7280}
    .t20{font-size:20px;font-weight:700}.t16{font-size:16px;font-weight:700}
    .t14{font-size:14px}.t13{font-size:13px}.t12{font-size:12px}
    .box{fill:#ffffff;stroke:#111827;stroke-width:2.5}
    .mono{font-family:Menlo,Consolas,monospace}
  </style>
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- header -->
  <circle cx="45" cy="42" r="20" fill="#8ED1FC" stroke="#111827" stroke-width="2.5"/>
  <text x="45" y="48" text-anchor="middle" class="ink t16">2</text>
  <text x="80" y="48" class="ink t20">EMBED — one lookup in a giant table. No computation yet.</text>

  <!-- incoming id -->
  <g>
    <rect x="60" y="100" width="110" height="44" rx="10" fill="#FF9E9E" stroke="#111827" stroke-width="2.5"/>
    <text x="115" y="128" text-anchor="middle" class="ink t16">9625</text>
    <text x="115" y="168" text-anchor="middle" class="mut t13">“ France”</text>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
      values="-140 0;-140 0;0 0;0 0" keyTimes="0;0.05;0.18;1"/>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.05;0.18;1"/>
  </g>
  <!-- arrow id -> table -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.20;0.26;1"/>
    <line x1="180" y1="122" x2="240" y2="122" stroke="#111827" stroke-width="2.5"/>
    <path d="M240,122 l-10,-6 v12 z" fill="#111827"/>
  </g>

  <!-- embedding table -->
  <rect x="252" y="80" width="300" height="280" rx="12" class="box"/>
  <text x="402" y="70" text-anchor="middle" class="ink t14" font-weight="700">the embedding table</text>
  <text x="402" y="385" text-anchor="middle" class="mut t13">151,936 rows × 1,024 numbers</text>
  <!-- table rows -->
  <g stroke="#d1d5db" stroke-width="1.5">
    <line x1="266" y1="112" x2="538" y2="112"/><line x1="266" y1="140" x2="538" y2="140"/>
    <line x1="266" y1="168" x2="538" y2="168"/><line x1="266" y1="196" x2="538" y2="196"/>
    <line x1="266" y1="252" x2="538" y2="252"/><line x1="266" y1="280" x2="538" y2="280"/>
    <line x1="266" y1="308" x2="538" y2="308"/><line x1="266" y1="336" x2="538" y2="336"/>
  </g>
  <!-- highlighted row 9625 (pulses) -->
  <rect x="264" y="208" width="276" height="32" rx="6" fill="#FFD54D" stroke="#111827" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
      values="0;0;1;0.55;1;0.55;1;1" keyTimes="0;0.26;0.32;0.38;0.44;0.50;0.56;1"/>
  </rect>
  <text x="402" y="229" text-anchor="middle" class="ink t13" font-weight="700" opacity="0">row 9625
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.26;0.32;1"/>
  </text>

  <!-- copy chip travels to output vector -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.72;0.76;1"/>
    <rect x="-52" y="-14" width="104" height="28" rx="8" fill="#FFD54D" stroke="#111827" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" class="mut t12">copy row</text>
    <animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.56;0.74;1" calcMode="linear"
      path="M 470,224 C 560,224 590,180 640,166"/>
  </g>

  <!-- output vector -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.72;0.78;1"/>
    <rect x="590" y="140" width="280" height="52" rx="12" fill="#DCFCE7" stroke="#111827" stroke-width="2.5"/>
    <text x="730" y="166" text-anchor="middle" class="ink t13 mono">[0.0, 0.013, −0.047, …]</text>
    <text x="730" y="184" text-anchor="middle" class="mut t12">× 1,024 numbers — the token’s starting vector</text>
  </g>

  <!-- facts -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.80;0.86;0.97;1"/>
    <text x="590" y="250" class="ink t14" font-weight="700">✓ same id → exact same vector, anywhere</text>
    <text x="590" y="278" class="ink t14" font-weight="700">✗ position is NOT added here</text>
    <text x="606" y="300" class="mut t13">it enters later, inside attention, via RoPE</text>
  </g>
</svg>
