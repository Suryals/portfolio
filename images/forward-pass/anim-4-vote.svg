<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, sans-serif">
  <style>
    .ink{fill:#111827}.mut{fill:#6b7280}
    .t20{font-size:20px;font-weight:700}.t16{font-size:16px;font-weight:700}
    .t14{font-size:14px}.t13{font-size:13px}.t12{font-size:12px}
    .box{fill:#ffffff;stroke:#111827;stroke-width:2.5}
    .mono{font-family:Menlo,Consolas,monospace}
  </style>
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- header -->
  <circle cx="45" cy="42" r="20" fill="#FF9E9E" stroke="#111827" stroke-width="2.5"/>
  <text x="45" y="48" text-anchor="middle" class="ink t16">4</text>
  <text x="80" y="48" class="ink t20">VOTE — the output is a ballot, not an answer</text>

  <!-- last vector -->
  <g>
    <rect x="60" y="120" width="180" height="60" rx="12" fill="#C5A8FF" stroke="#111827" stroke-width="2.5"/>
    <text x="150" y="146" text-anchor="middle" class="ink t14" font-weight="700">last token’s vector</text>
    <text x="150" y="166" text-anchor="middle" class="mut t12">after 28 blocks</text>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.04;0.12;1"/>
  </g>
  <!-- arrow -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.14;0.20;1"/>
    <line x1="248" y1="150" x2="300" y2="150" stroke="#111827" stroke-width="2.5"/>
    <path d="M300,150 l-10,-6 v12 z" fill="#111827"/>
  </g>
  <!-- compare box -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.18;0.26;1"/>
    <rect x="306" y="106" width="220" height="88" rx="12" class="box"/>
    <text x="416" y="136" text-anchor="middle" class="ink t14" font-weight="700">compare against ALL</text>
    <text x="416" y="156" text-anchor="middle" class="ink t14" font-weight="700">151,936 table rows</text>
    <text x="416" y="178" text-anchor="middle" class="mut t12">same table as stage 2, reused</text>
  </g>
  <!-- arrow -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.28;0.34;1"/>
    <line x1="534" y1="150" x2="586" y2="150" stroke="#111827" stroke-width="2.5"/>
    <path d="M586,150 l-10,-6 v12 z" fill="#111827"/>
    <text x="560" y="136" text-anchor="middle" class="mut t12">softmax</text>
  </g>

  <!-- ballot: bars grow. widths ∝ real % (×10) -->
  <g class="t14">
    <text x="596" y="98" class="ink t16">the ballot</text>
    <!-- labels -->
    <g text-anchor="end" class="mono">
      <text x="660" y="142" class="ink t13">' Paris'</text>
      <text x="660" y="182" class="ink t13">' in'</text>
      <text x="660" y="222" class="ink t13">'____'</text>
      <text x="660" y="262" class="ink t13">' __'</text>
      <text x="660" y="302" class="ink t13">' ____'</text>
    </g>
    <!-- bars -->
    <rect x="672" y="126" height="22" rx="6" fill="#7BC96F" stroke="#111827" stroke-width="2" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;196;196" keyTimes="0;0.36;0.50;1"/>
    </rect>
    <rect x="672" y="166" height="22" rx="6" fill="#8ED1FC" stroke="#111827" stroke-width="2" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;60;60" keyTimes="0;0.40;0.54;1"/>
    </rect>
    <rect x="672" y="206" height="22" rx="6" fill="#FFD54D" stroke="#111827" stroke-width="2" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;39;39" keyTimes="0;0.44;0.58;1"/>
    </rect>
    <rect x="672" y="246" height="22" rx="6" fill="#FFD54D" stroke="#111827" stroke-width="2" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;32;32" keyTimes="0;0.48;0.62;1"/>
    </rect>
    <rect x="672" y="286" height="22" rx="6" fill="#FFD54D" stroke="#111827" stroke-width="2" width="0">
      <animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;30;30" keyTimes="0;0.52;0.66;1"/>
    </rect>
    <!-- percents -->
    <g class="t13" font-weight="700" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.62;0.70;1"/>
      <text x="874" y="142" text-anchor="end" class="ink">27.94%</text>
      <text x="740" y="182" class="ink">8.52%</text>
      <text x="720" y="222" class="mut">5.50%</text>
      <text x="712" y="262" class="mut">4.56%</text>
      <text x="710" y="302" class="mut">4.28%</text>
    </g>
    <text x="672" y="332" class="mut t12" opacity="0">…plus 151,931 more candidates
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.62;0.70;1"/>
    </text>
  </g>

  <!-- takeaway -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.74;0.82;0.97;1"/>
    <rect x="60" y="356" width="600" height="46" rx="12" fill="#FEF3C7" stroke="#111827" stroke-width="2.5"/>
    <text x="360" y="385" text-anchor="middle" class="ink t14" font-weight="700">the model never says “Paris” — something OUTSIDE it picks from this ballot</text>
  </g>
</svg>
