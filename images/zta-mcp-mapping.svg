<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-label="Zero Token Architecture mapped onto MCP: infer, export and run at runtime (the tool is the export) and at build time (the SDK is the export)" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1600" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="830" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#111827">Zero Token Architecture, applied to MCP</text>
  <text x="830" y="90" text-anchor="middle" font-size="17" fill="#6b7280">Infer once. Export the logic. Run without inference — at runtime and at build time.</text>

  <!-- Column headers -->
  <text x="390" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">1 · INFER</text>
  <text x="390" y="174" text-anchor="middle" font-size="13" fill="#6b7280">the model works it out</text>
  <line x1="600" y1="158" x2="640" y2="158" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="830" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">2 · EXPORT</text>
  <text x="830" y="174" text-anchor="middle" font-size="13" fill="#6b7280">capture it as a thing</text>
  <line x1="1040" y1="158" x2="1080" y2="158" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="1270" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">3 · RUN</text>
  <text x="1270" y="174" text-anchor="middle" font-size="13" fill="#6b7280">execute without the model</text>

  <line x1="180" y1="196" x2="1480" y2="196" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row labels -->
  <text transform="translate(70 360) rotate(-90)" text-anchor="middle" font-size="15" font-weight="700" fill="#111827" letter-spacing="1.5">RUNTIME</text>
  <text transform="translate(96 360) rotate(-90)" text-anchor="middle" font-size="12" fill="#6b7280">the tool is the export</text>

  <text transform="translate(70 720) rotate(-90)" text-anchor="middle" font-size="15" font-weight="700" fill="#111827" letter-spacing="1.5">BUILD TIME</text>
  <text transform="translate(96 720) rotate(-90)" text-anchor="middle" font-size="12" fill="#6b7280">the SDK is the export</text>

  <line x1="180" y1="540" x2="1480" y2="540" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ===== ROW 1 / COL 1: generic tool loop ===== -->
  <rect x="290" y="220" width="200" height="46" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="390" y="249" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">model</text>

  <rect x="255" y="400" width="270" height="46" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="390" y="429" text-anchor="middle" font-size="15" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#111827">execute_sql(query)</text>

  <line x1="368" y1="266" x2="368" y2="398" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="356" y="337" text-anchor="end" font-size="12" fill="#374151">builds the query</text>

  <line x1="412" y1="400" x2="412" y2="268" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="424" y="337" text-anchor="start" font-size="12" fill="#374151">raw rows back</text>

  <!-- re-inference loop -->
  <path d="M 566 310 A 26 26 0 1 1 540 336" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="566" y="380" text-anchor="middle" font-size="11" fill="#b91c1c">× N</text>

  <text x="390" y="478" text-anchor="middle" font-size="13" fill="#b91c1c">wrong columns, retry — same reasoning on every call</text>
  <text x="390" y="500" text-anchor="middle" font-size="13" fill="#6b7280">generic tool: a capability in, the thinking left to the model</text>

  <!-- ===== ROW 1 / COL 2: curated tool card ===== -->
  <rect x="640" y="228" width="380" height="232" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="662" y="262" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#2563eb">get_stuck_invoices(</text>
  <text x="662" y="284" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#2563eb">    older_than_days, approver)</text>
  <line x1="662" y1="300" x2="998" y2="300" stroke="#bfdbfe" stroke-width="1"/>
  <text x="662" y="332" font-size="14" fill="#111827">•  which tables, which joins</text>
  <text x="662" y="360" font-size="14" fill="#111827">•  which status codes mean “stuck”</text>
  <text x="662" y="388" font-size="14" fill="#111827">•  the result shape the model needs</text>
  <text x="662" y="416" font-size="14" fill="#111827">•  a deterministic function in the backend</text>
  <text x="662" y="444" font-size="12" fill="#2563eb" font-style="italic">worked out once — by a person, or by the agent in discovery</text>

  <text x="830" y="500" text-anchor="middle" font-size="13" fill="#6b7280">curated tool: the reasoning, captured</text>

  <!-- ===== ROW 1 / COL 3: run path ===== -->
  <rect x="1160" y="220" width="220" height="46" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="1270" y="249" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">model</text>

  <rect x="1130" y="320" width="280" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1270" y="349" text-anchor="middle" font-size="14" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#2563eb">get_stuck_invoices(…)</text>

  <rect x="1160" y="420" width="220" height="46" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="1270" y="449" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">source system</text>

  <line x1="1248" y1="266" x2="1248" y2="318" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1236" y="296" text-anchor="end" font-size="12" fill="#374151">intent → two args</text>
  <line x1="1292" y1="320" x2="1292" y2="268" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1304" y="296" text-anchor="start" font-size="12" fill="#374151">exact shape</text>

  <line x1="1248" y1="366" x2="1248" y2="418" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1236" y="396" text-anchor="end" font-size="12" fill="#374151">deterministic call</text>
  <line x1="1292" y1="420" x2="1292" y2="368" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1304" y="396" text-anchor="start" font-size="12" fill="#374151">rows</text>

  <text x="1270" y="500" text-anchor="middle" font-size="13" fill="#6b7280">one call, no re-inference of solved logic</text>

  <!-- ===== ROW 2 / COL 1: three servers, three auth implementations ===== -->
  <text x="390" y="580" text-anchor="middle" font-size="13" fill="#374151">coding agent, from a spec, from scratch:</text>

  <rect x="195" y="596" width="120" height="112" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="255" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">server A</text>
  <text x="255" y="646" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#374151">sub: inline</text>
  <text x="255" y="668" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#374151">cache: session</text>
  <text x="255" y="690" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#374151">prop: header</text>

  <rect x="330" y="596" width="120" height="112" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="390" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">server B</text>
  <text x="390" y="646" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#374151">sub: middleware</text>
  <text x="390" y="668" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#374151">cache: request</text>
  <text x="390" y="690" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#374151">prop: exchange</text>

  <rect x="465" y="596" width="120" height="112" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="525" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">server C</text>
  <text x="525" y="646" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#374151">sub: helper</text>
  <text x="525" y="668" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#374151">cache: none</text>
  <text x="525" y="690" text-anchor="middle" font-size="11.5" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#374151">prop: header</text>

  <!-- re-inference loop, build time -->
  <path d="M 612 620 A 20 20 0 1 1 592 640" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="612" y="678" text-anchor="middle" font-size="11" fill="#b91c1c">× 3</text>

  <text x="390" y="748" text-anchor="middle" font-size="13" fill="#b91c1c">same problem solved three times, three slightly different ways</text>
  <text x="390" y="770" text-anchor="middle" font-size="13" fill="#6b7280">one bug = three rediscoveries</text>

  <!-- ===== ROW 2 / COL 2: SDK card ===== -->
  <rect x="640" y="590" width="380" height="204" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="662" y="622" font-size="15" font-weight="700" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" fill="#2563eb">GovernedServer  (SDK)</text>
  <line x1="662" y1="636" x2="998" y2="636" stroke="#bfdbfe" stroke-width="1"/>
  <text x="662" y="666" font-size="14" fill="#111827">•  validate token, extract sub</text>
  <text x="662" y="694" font-size="14" fill="#111827">•  propagate identity downstream</text>
  <text x="662" y="722" font-size="14" fill="#111827">•  session-scoped cache</text>
  <text x="662" y="750" font-size="14" fill="#111827">•  audit + manifest registration</text>
  <text x="662" y="778" font-size="12" fill="#2563eb" font-style="italic">cross-cutting auth: solved once, fixed once</text>

  <text x="830" y="830" text-anchor="middle" font-size="13" fill="#6b7280">SDK: the loop, run once</text>

  <!-- ===== ROW 2 / COL 3: build on the export ===== -->
  <rect x="1130" y="596" width="280" height="44" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="1270" y="624" text-anchor="middle" font-size="14" fill="#111827">tool code — yours, per server</text>
  <rect x="1130" y="640" width="280" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1270" y="668" text-anchor="middle" font-size="14" fill="#2563eb">GovernedServer SDK — shared</text>

  <line x1="1270" y1="684" x2="1270" y2="738" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1284" y="716" text-anchor="start" font-size="12" fill="#374151">coding agent builds on it</text>

  <rect x="1130" y="740" width="280" height="44" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="1270" y="768" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">server D · E · F …</text>

  <text x="1270" y="830" text-anchor="middle" font-size="13" fill="#6b7280">new servers inherit the fix, not the problem</text>

  <!-- Footer -->
  <line x1="180" y1="866" x2="1480" y2="866" stroke="#e5e7eb" stroke-width="1"/>
  <text x="830" y="905" text-anchor="middle" font-size="17" font-style="italic" fill="#111827">Not zero tokens. Zero re-inference of logic you have already solved.</text>
  <text x="1480" y="938" text-anchor="end" font-size="12" fill="#9ca3af">suryal.dev · after Kelsey Hightower, “ZTA”, PlatformCon 2026</text>
</svg>
